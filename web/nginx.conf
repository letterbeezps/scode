# 前端静态托管 + /api 反代到后端。
#
# 与开发态的 Vite 代理保持同一套约定（web/vite.config.ts）：
#   前端请求 /api/xxx  →  后端收到 /xxx
# 也就是说 /api 这个前缀只是"同源代理"用的，剥掉之后才是后端的真实路由。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 内嵌 DNS。用变量形式的 proxy_pass 才能在**运行时**解析域名：
    # 后端容器重建后 IP 会变，静态 upstream 会一直指着旧 IP 直到 nginx 重启。
    resolver 127.0.0.11 ipv6=off valid=10s;

    # 前端是 SPA（react-router BrowserRouter）：/chat/xxx、/settings 这些
    # 前端路由在磁盘上没有对应文件，必须回落到 index.html，
    # 否则刷新页面直接 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* → 后端。剥掉 /api 前缀（和 vite dev 代理的 rewrite 一致）。
    location /api/ {
        # set 必须写在 rewrite 前面：rewrite 模块按配置顺序执行指令，
        # 而 `rewrite ... break` 会终止本模块后续指令的执行——
        # set 写在后面的话 $api_upstream 根本没被赋值，
        # nginx 报 "using uninitialized api_upstream variable" 然后 500。
        set $api_upstream http://backend:2024;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：POST /threads/{id}/runs/stream 是长连接流式响应。
        # 必须关掉缓冲——开着的话 nginx 会攒够一块才吐给前端，
        # 界面上的"逐字输出"效果就没了（看起来像一次性刷出来）。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        # agent 一轮跑几分钟是常事，默认 60s 的读超时会把流掐断。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 10m;
    }
}
